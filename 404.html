<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #030303;
      color: #fdfdfd;
      text-align: center;
    }

    .content {
      max-width: 400px;
    }

    h1 {
      font-size: 6rem;
      margin-bottom: 0.5rem;
      color: #ff4c4c;
    }

    h2 {
      font-size: 1.8rem;
      font-weight: 400;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1rem;
      margin-bottom: 2rem;
      color: #c0bcbc;
    }

    button {
  background-color: #5f748a;
  color: white;
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.3s;
}

button:hover {
  background-color: #202f3f;
}

  </style>
</head>
<body>
 <div class="content">
  <h1>404</h1>
  <h2>Page Not Found</h2>
  <p>Sorry, the page you’re looking for doesn’t exist.</p>
  <button onclick="goBack()">Go Back</button>
</div>

<script>
function goBack() {
  if (document.referrer && document.referrer !== window.location.href) {
    // If the user came from another page, go back
    window.history.back();
  } else {
    // If no referrer or same page, go to homepage
    window.location.href = 'main.html'; // replace with your homepage
  }
}
</script>


</body>
</html>
