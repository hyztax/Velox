<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* Starfield canvas behind everything */
    #starfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

 html  {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden; /* removes scrollbars */
  font-family: 'Inter', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #050505;
  color: #fdfdfd;
  text-align: center;
  flex-direction: column;
  padding: 20px;
}

body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden; /* removes scrollbars */
  font-family: 'Inter', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #d4101000;
  color: #fdfdfd;
  text-align: center;
  flex-direction: column;
  padding: 20px;
}


    .content {
      max-width: 400px;
      background: rgba(153, 59, 59, 0);
      background-color: #b6232300;
    }

    .error-icon {
      width: 90px;
      height: 90px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

   h1 {
  font-size: 1rem; /* smaller than before */
  margin-bottom: 2rem;
  color: #b8b4b4;
  font-weight: 400; /* makes text normal weight */
}


button {
  background-color: #ffffffe7;
  color: rgb(44, 43, 43);
  padding: 10px 15px;       /* keeps the button size */
  border: none;
  border-radius: 30px;
  font-weight: 500;
  cursor: pointer;
  font-size: 1rem;       /* smaller text */
  display: inline-flex;
  align-items: center;
  gap: 10px;
  transition: background 0.3s;
  font-weight: 600;
}

    button:hover {
      background-color: #a8a8a8;
    }

    .arrow {
      font-size: 1.5rem;
      line-height: 1;
    }
  </style>
</head>
<body>

  <div class="content">
    <!-- White error icon -->
    <img class="error-icon" src="images/errorIcon.png" alt="Error Icon">

    <h2>Something went wrong</h2>
    <h1>404 | Page not found</h1>
    <button onclick="goBack()"></span> Go back</button>
  </div>

  <script>
    function goBack() {
      // Always go back to previous page if available
      window.history.back();
    }
  </script>

  <canvas id="starfield"></canvas>
  <script src="stars.js"></script>

</body>
</html>
